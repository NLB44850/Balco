# Mises à jour automatiques des dépendances de Balco.
# Expo, React et React Native sont exclus des montées mineures et majeures :
# ils se mettent à jour ensemble lors d'une montée de SDK Expo
# (npx expo install --fix), traitée dans l'issue de maintenance mensuelle.
version: 2
updates:
  - package-ecosystem: "npm"   # gère aussi pnpm-lock.yaml
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels: ["dependances"]
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # React est figé à la version exacte du moteur de React Native (19.1.0 pour le SDK 54) : même un
      # correctif (19.1.9) casserait l'app au démarrage. Il ne bouge qu'avec le SDK.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native-worklets"
      # React Native suit la version exacte fixée par le SDK Expo (0.81.5 pour le SDK 54), correctifs compris.
      - dependency-name: "react-native"
      # Outils d'Expo dont le nom ne commence pas par « expo » : ils suivent eux aussi la montée de SDK.
      - dependency-name: "babel-preset-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Les types de Node suivent la version du serveur (Node 22 dans le Dockerfile et la CI).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Versions imposées par le SDK Expo (expo install --check) : elles suivent la montée de SDK.
      - dependency-name: "@react-native-async-storage/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-navigation/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # NativeWind 4 s'appuie sur Tailwind CSS 3 ; tailwind-merge 3 ne gère que Tailwind 4.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
    groups:
      # Une seule PR par semaine pour les petites mises à jour
      correctifs-et-mineures:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependances"]
