# Construit la version Play Store (fichier .aab, nom technique fr.balco.app) sur les serveurs d'Expo, d'un bouton dans
# l'onglet Actions de GitHub. Mêmes réglages que « Construire l'APK de test » : secret EXPO_TOKEN et variable
# BALCO_API_URL. Pas de simulation météo ni de « Version de test » dans cette version.
# Le fichier se télécharge sur expo.dev, puis s'envoie à la main dans la Play Console (docs/publication-play-store.md).
name: Construire la version Play Store

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BALCO_API_URL: ${{ vars.BALCO_API_URL }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Ajoute le secret EXPO_TOKEN (Settings → Secrets and variables → Actions)."; exit 1; fi
          if [ -z "$BALCO_API_URL" ]; then echo "::error::Ajoute la variable BALCO_API_URL (l'adresse Railway)."; exit 1; fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Adresse du serveur dans le profil « production »
        env:
          BALCO_API_URL: ${{ vars.BALCO_API_URL }}
        run: |
          jq --arg url "${BALCO_API_URL%/}" '.build.production.env.EXPO_PUBLIC_API_BASE_URL = $url' eas.json > eas.tmp && mv eas.tmp eas.json
          jq '.build.production.env' eas.json
      - name: Lancer la construction
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
          EAS_SKIP_AUTO_FINGERPRINT: "1"
        run: |
          npx --yes eas-cli@latest build --platform android --profile production --non-interactive --no-wait --json > build.json
          cat build.json
          id=$(jq -r '.[0].id // empty' build.json 2>/dev/null || true)
          owner=$(jq -r '.[0].project.ownerAccount.name // empty' build.json 2>/dev/null || true)
          if [ -n "$id" ] && [ -n "$owner" ]; then url="https://expo.dev/accounts/$owner/projects/balco/builds/$id"; else url="https://expo.dev (projet Balco → Builds)"; fi
          echo "### Version Play Store en construction" >> "$GITHUB_STEP_SUMMARY"
          echo "Suis la construction et télécharge le fichier .aab ici : $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Puis envoie-le dans la Play Console (docs/publication-play-store.md)." >> "$GITHUB_STEP_SUMMARY"
